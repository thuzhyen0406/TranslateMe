      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/*/platform*'

  # DEFAULT_4XX/5XX đã có ở Default4xxGatewayResponse/Default5xxGatewayResponse (cuối tệp). Hai tài nguyên dưới
  # đây là bản trùng thêm nhầm ở PR #53; giữ nội dung giống hệt bản gốc để thứ tự áp dụng không quan trọng.
  # Retain: khi xóa khỏi template (PR sau), CloudFormation không gọi DeleteGatewayResponse, vốn sẽ đặt lại
  # DEFAULT_4XX/5XX về mặc định của AWS và làm mất cấu hình của bản gốc.
  GatewayResponseDefault4xx:
    Type: AWS::ApiGateway::GatewayResponse
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RestApiId: !Ref RestApi
      ResponseType: DEFAULT_4XX
      ResponseParameters:
        gatewayresponse.header.Content-Type: "'application/json'"
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Authorization,Content-Type'"
      ResponseTemplates:
        application/json: '{"request_id":"$context.requestId","error":{"code":"INVALID_REQUEST","message":"Yêu cầu không hợp lệ."}}'

  GatewayResponseDefault5xx:
    Type: AWS::ApiGateway::GatewayResponse
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RestApiId: !Ref RestApi
      ResponseType: DEFAULT_5XX
      ResponseParameters:
        gatewayresponse.header.Content-Type: "'application/json'"
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Authorization,Content-Type'"
      ResponseTemplates:
        application/json: '{"request_id":"$context.requestId","error":{"code":"INTERNAL_ERROR","message":"Lỗi tạm thời phía hệ thống."}}'

  # Đổi tên logical ID (V3 -> V4) mỗi khi method/gateway response thay đổi: CloudFormation chỉ tạo
  # Deployment mới khi tài nguyên này bị thay, nếu giữ tên cũ thay đổi không lên stage.
  ApiDeploymentV4:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - ConsoleMethod
      - ConsoleProxyMethod
      - ConsoleProxyOptionsMethod
      - HostsMethod
      - HostSlugMethod
      - HostSlugProxyMethod
      - HostPrewarmMethod
      - HostsOptionsMethod
      - HostSlugOptionsMethod
      - HostSlugProxyOptionsMethod
      - HostPrewarmOptionsMethod
      - PlatformTenantStatusMethod
      - TranslateMethod
      - TranslateProxyMethod
      - BatchSessionMethod
      - BatchSessionUploadUrlMethod
      - BatchSessionOptionsMethod
      - BatchSessionUploadUrlOptionsMethod
      - BatchSessionJobMethod
      - BatchSessionJobOptionsMethod
      - TranslateSessionRealtimeMethod
      - TranslateSessionRealtimeOptionsMethod
      - GatewayResponseDefault4xx
      - GatewayResponseDefault5xx
      - UnauthorizedGatewayResponse
      - InvalidApiKeyGatewayResponse
      - AccessDeniedGatewayResponse
      - ThrottledGatewayResponse
      - QuotaExceededGatewayResponse
      - Default4xxGatewayResponse
      - Default5xxGatewayResponse
    Properties:
      RestApiId: !Ref RestApi
      Description: API deployment including Console realtime and batch job session routes.

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref RestApi
      DeploymentId: !Ref ApiDeploymentV4
      StageName: !Ref StageName

  BasicUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    Properties:
      UsagePlanName: !Sub '${AWS::StackName}-basic'
      Description: Basic plan for Console API keys.
      ApiStages:
        - ApiId: !Ref RestApi
          Stage: !Ref ApiStage
      Throttle:
        RateLimit: !Ref BasicRateLimit
        BurstLimit: !Ref BasicBurstLimit
      Quota:
        Limit: !Ref BasicDailyQuota
        Period: DAY

  StandardUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    Properties:
      UsagePlanName: !Sub '${AWS::StackName}-standard'
      Description: Standard plan for Console API keys.
      ApiStages:
        - ApiId: !Ref RestApi
          Stage: !Ref ApiStage
      Throttle:
        RateLimit: !Ref StandardRateLimit
        BurstLimit: !Ref StandardBurstLimit
      Quota:
        Limit: !Ref StandardMonthlyQuota
        Period: MONTH

  UnauthorizedGatewayResponse:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref RestApi
      ResponseType: UNAUTHORIZED
      StatusCode: '401'
      ResponseParameters:
        gatewayresponse.header.Content-Type: "'application/json'"
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Authorization,Content-Type'"
      ResponseTemplates:
        application/json: '{"request_id":"$context.requestId","error":{"code":"UNAUTHORIZED","message":"Thiếu hoặc không hợp lệ thông tin xác thực."}}'

  InvalidApiKeyGatewayResponse:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref RestApi
      ResponseType: INVALID_API_KEY
      StatusCode: '401'
      ResponseParameters:
        gatewayresponse.header.Content-Type: "'application/json'"
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Authorization,Content-Type'"
      ResponseTemplates:
        application/json: '{"request_id":"$context.requestId","error":{"code":"UNAUTHORIZED","message":"API key không hợp lệ hoặc không được cung cấp."}}'

  AccessDeniedGatewayResponse:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref RestApi
      ResponseType: ACCESS_DENIED
      StatusCode: '403'
      ResponseParameters:
        gatewayresponse.header.Content-Type: "'application/json'"
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Authorization,Content-Type'"
      ResponseTemplates:
        application/json: '{"request_id":"$context.requestId","error":{"code":"FORBIDDEN","message":"Yêu cầu bị từ chối."}}'

  ThrottledGatewayResponse:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref RestApi
      ResponseType: THROTTLED
      StatusCode: '429'
      ResponseParameters:
        gatewayresponse.header.Content-Type: "'application/json'"
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Authorization,Content-Type'"
      ResponseTemplates:
        application/json: '{"request_id":"$context.requestId","error":{"code":"RATE_LIMITED","message":"Vượt tốc độ yêu cầu của gói API."}}'

  QuotaExceededGatewayResponse:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref RestApi
      ResponseType: QUOTA_EXCEEDED
      StatusCode: '429'
      ResponseParameters:
        gatewayresponse.header.Content-Type: "'application/json'"
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Authorization,Content-Type'"
      ResponseTemplates:
        application/json: '{"request_id":"$context.requestId","error":{"code":"REQUEST_QUOTA_EXCEEDED","message":"Hết hạn ngạch số yêu cầu của gói API trong kỳ."}}'

  Default4xxGatewayResponse:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref RestApi
      ResponseType: DEFAULT_4XX
      ResponseParameters:
        gatewayresponse.header.Content-Type: "'application/json'"
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Authorization,Content-Type'"
      ResponseTemplates:
        application/json: '{"request_id":"$context.requestId","error":{"code":"INVALID_REQUEST","message":"Yêu cầu không hợp lệ."}}'

  Default5xxGatewayResponse:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref RestApi
      ResponseType: DEFAULT_5XX
      ResponseParameters:
        gatewayresponse.header.Content-Type: "'application/json'"
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Authorization,Content-Type'"
      ResponseTemplates:
        application/json: '{"request_id":"$context.requestId","error":{"code":"INTERNAL_ERROR","message":"Lỗi tạm thời phía hệ thống."}}'

Outputs:
  ApiId:
    Description: REST API ID.
    Value: !Ref RestApi
  ApiBaseUrl:
    Description: Base URL for the deployed REST API stage.
    Value: !Sub 'https://${RestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${StageName}'
  BasicUsagePlanId:
    Description: Usage plan ID for Basic API keys.
    Value: !Ref BasicUsagePlan
  StandardUsagePlanId:
    Description: Usage plan ID for Standard API keys.
    Value: !Ref StandardUsagePlan
