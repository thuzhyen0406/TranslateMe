AWSTemplateFormatVersion: '2010-09-09'
Description: TranslateMe application Lambda functions, wired to the least-privilege IAM role outputs.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3

Parameters:
  ArtifactBucket:
    Type: String
  ProxyCodeKey:
    Type: String
  WorkerCodeKey:
    Type: String
  ConsoleCodeKey:
    Type: String
  TranslateCodeKey:
    Type: String
  PlatformCodeKey:
    Type: String
  PostConfirmationCodeKey:
    Type: String
  TableName:
    Type: String
  PayloadBucketName:
    Type: String
  BatchUploadBucketName:
    Type: String
  PayloadBucketArn:
    Type: String
  BatchUploadBucketArn:
    Type: String
  BatchUploadKmsKeyArn:
    Type: String
  BasicUsagePlanId:
    Type: String
  StandardUsagePlanId:
    Type: String
  UserPoolArn:
    Type: String
  CloudFrontDistributionId:
    Type: String
  WorkerFunctionArn:
    Type: String
    Description: Same ARN supplied to the IAM stack's WorkerFunctionArn parameter.
  TenantDataAccessRoleArn:
    Type: String
  ProxyRoleArn:
    Type: String
  WorkerRoleArn:
    Type: String
  ConsoleRoleArn:
    Type: String
  TranslateRoleArn:
    Type: String
  PlatformRoleArn:
    Type: String
  PostConfirmationRoleArn:
    Type: String
  ProxyHandler:
    Type: String
    Default: services/proxy/handler.handler
  WorkerHandler:
    Type: String
    Default: services/proxy/worker.handler
  ConsoleHandler:
    Type: String
    Default: services/api/console/handler.handler
    Description: Unified Console API router (services/api/console/handler.ts) dispatching all /console/* routes (review, glossary, sites, members). Can be overridden to a dedicated handler (e.g. services/api/review/reviewManager.reviewLambdaHandler) if deploying routes to separate Lambdas.
  TranslateHandler:
    Type: String
    Default: services/api/translate/realtime.handler
  PlatformHandler:
    Type: String
    Default: services/api/platform/handler.handler
  PostConfirmationHandler:
    Type: String
    Default: services/api/auth/postConfirmation.handler
  StageName:
    Type: String
    Default: dev
    AllowedPattern: '[A-Za-z0-9_-]+'
  TranslateConcurrency:
    Type: Number
    Default: 4
    MinValue: 1
    MaxValue: 10

Resources:
  ProxyFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'translateme-${StageName}-proxy'
      Runtime: nodejs22.x
      Handler: !Ref ProxyHandler
      Role: !Ref ProxyRoleArn
      Timeout: 60
      MemorySize: 1024
      Code: { S3Bucket: !Ref ArtifactBucket, S3Key: !Ref ProxyCodeKey }
      Environment:
        Variables:
          TABLE_NAME: !Ref TableName
          WORKER_PAYLOAD_BUCKET: !Ref PayloadBucketName
          WORKER_FUNCTION_NAME: !Ref WorkerFunctionArn
          TENANT_DATA_ACCESS_ROLE_ARN: !Ref TenantDataAccessRoleArn
          TENANT_PAYLOAD_BUCKET_ARN: !Ref PayloadBucketArn

  WorkerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'translateme-${StageName}-worker'
      Runtime: nodejs22.x
      Handler: !Ref WorkerHandler
      Role: !Ref WorkerRoleArn
      Timeout: 240
      MemorySize: 1024
      Code: { S3Bucket: !Ref ArtifactBucket, S3Key: !Ref WorkerCodeKey }
      Environment:
        Variables:
          TABLE_NAME: !Ref TableName
          WORKER_PAYLOAD_BUCKET: !Ref PayloadBucketName
          TENANT_DATA_ACCESS_ROLE_ARN: !Ref TenantDataAccessRoleArn
          TENANT_PAYLOAD_BUCKET_ARN: !Ref PayloadBucketArn

  ConsoleFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'translateme-${StageName}-console-api'
      Runtime: nodejs22.x
      Handler: !Ref ConsoleHandler
      Role: !Ref ConsoleRoleArn
      Timeout: 30
      MemorySize: 512
      Code: { S3Bucket: !Ref ArtifactBucket, S3Key: !Ref ConsoleCodeKey }
      Environment:
        Variables:
          TABLE_NAME: !Ref TableName
          USER_POOL_ARN: !Ref UserPoolArn
          CLOUDFRONT_DISTRIBUTION_ID: !Ref CloudFrontDistributionId
          TENANT_DATA_ACCESS_ROLE_ARN: !Ref TenantDataAccessRoleArn
          PREWARM_STATE_MACHINE_ARN: !Sub 'arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:translateme-${StageName}-prewarm'

  TranslateFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'translateme-${StageName}-translate-api'
      Runtime: nodejs22.x
      Handler: !Ref TranslateHandler
      Role: !Ref TranslateRoleArn
      Timeout: 60
      MemorySize: 1024
      Code: { S3Bucket: !Ref ArtifactBucket, S3Key: !Ref TranslateCodeKey }
      Environment:
        Variables:
          TABLE_NAME: !Ref TableName
          BATCH_UPLOAD_BUCKET: !Ref BatchUploadBucketName
          TENANT_DATA_ACCESS_ROLE_ARN: !Ref TenantDataAccessRoleArn
          TENANT_BATCH_UPLOAD_BUCKET_ARN: !Ref BatchUploadBucketArn
          TENANT_BATCH_UPLOAD_KMS_KEY_ARN: !Ref BatchUploadKmsKeyArn
          BATCH_STATE_MACHINE_ARN: !Sub 'arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:translateme-${StageName}-batch'
          TRANSLATE_CONCURRENCY: !Ref TranslateConcurrency

  BatchWorkflowFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'translateme-${StageName}-batch-workflow'
      Runtime: nodejs22.x
      Handler: services/api/batch/batchWorkflow.handler
      Role: !Ref TranslateRoleArn
      Timeout: 300
      MemorySize: 1024
      Code: { S3Bucket: !Ref ArtifactBucket, S3Key: !Ref TranslateCodeKey }
      Environment:
        Variables:
          TABLE_NAME: !Ref TableName
          BATCH_UPLOAD_BUCKET: !Ref BatchUploadBucketName
          TENANT_DATA_ACCESS_ROLE_ARN: !Ref TenantDataAccessRoleArn
          TENANT_BATCH_UPLOAD_BUCKET_ARN: !Ref BatchUploadBucketArn
          TENANT_BATCH_UPLOAD_KMS_KEY_ARN: !Ref BatchUploadKmsKeyArn

  BatchStateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'translateme-${StageName}-batch-sfn'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: states.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invoke-batch-workflow
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt BatchWorkflowFunction.Arn
              - Effect: Allow
                Action: sns:CreateTopic
                Resource: !Sub 'arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:translateme-batch-${StageName}-*'
              - Effect: Allow
                Action: sns:Subscribe
                Resource: !Sub 'arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:translateme-batch-${StageName}-*'
                Condition:
                  StringEquals:
                    sns:Protocol: email
              - Effect: Allow
                Action: sns:Publish
                Resource: !Sub 'arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:translateme-batch-${StageName}-*'

  BatchStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub 'translateme-${StageName}-batch'
      StateMachineType: STANDARD
      RoleArn: !GetAtt BatchStateMachineRole.Arn
      DefinitionString: !Sub
        - |-
          {
            "Comment": "TranslateMe F10 batch: parse, translate bounded lots and assemble results.",
            "StartAt": "ParseAndChunk",
            "States": {
              "ParseAndChunk": {
                "Type": "Task", "Resource": "${BatchWorkflowArn}", "TimeoutSeconds": 300,
                "Parameters": { "mode": "PARSE_AND_CHUNK", "job_id.$": "$.job_id", "tenant_id.$": "$.tenant_id" },
                "Retry": [{ "ErrorEquals": ["Lambda.ServiceException", "Lambda.AWSLambdaException", "Lambda.SdkClientException", "Lambda.TooManyRequestsException"], "IntervalSeconds": 2, "BackoffRate": 2, "MaxAttempts": 3 }],
                "Catch": [{ "ErrorEquals": ["States.ALL"], "ResultPath": "$.error", "Next": "MarkFailed" }],
                "Next": "TranslateLots"
              },
              "TranslateLots": {
                "Type": "Map", "ItemsPath": "$.lot_keys", "MaxConcurrency": 5,
                "ItemSelector": { "job_id.$": "$.job_id", "tenant_id.$": "$.tenant_id", "target_langs.$": "$.target_langs", "lot_key.$": "$$.Map.Item.Value" },
                "ItemProcessor": {
                  "ProcessorConfig": { "Mode": "INLINE" }, "StartAt": "TranslateLanguages",
                  "States": {
                    "TranslateLanguages": {
                      "Type": "Map", "ItemsPath": "$.target_langs", "MaxConcurrency": 1,
                      "ItemSelector": { "job_id.$": "$.job_id", "tenant_id.$": "$.tenant_id", "lot_key.$": "$.lot_key", "target_lang.$": "$$.Map.Item.Value" },
                      "ItemProcessor": {
                        "ProcessorConfig": { "Mode": "INLINE" }, "StartAt": "TranslateLot",
                        "States": {
                          "TranslateLot": {
                            "Type": "Task", "Resource": "${BatchWorkflowArn}", "TimeoutSeconds": 300,
                            "Parameters": { "mode": "TRANSLATE_LOT", "job_id.$": "$.job_id", "tenant_id.$": "$.tenant_id", "lot_key.$": "$.lot_key", "target_lang.$": "$.target_lang", "attempt.$": "$$.State.RetryCount" },
                            "Retry": [{ "ErrorEquals": ["ThrottlingException", "TooManyRequestsException", "Lambda.ServiceException", "Lambda.AWSLambdaException", "Lambda.SdkClientException", "BatchTranslationIncomplete"], "IntervalSeconds": 2, "BackoffRate": 2, "MaxAttempts": 3 }],
                            "End": true
                          }
                        }
                      },
                      "ResultPath": null,
                      "End": true
                    }
                  }
                },
                "ResultPath": null,
                "Catch": [{ "ErrorEquals": ["States.ALL"], "ResultPath": "$.error", "Next": "MarkFailed" }],
                "Next": "MergeAndWrite"
              },
              "MergeAndWrite": {
                "Type": "Task", "Resource": "${BatchWorkflowArn}", "TimeoutSeconds": 300,
                "Parameters": { "mode": "MERGE_AND_WRITE", "job_id.$": "$.job_id", "tenant_id.$": "$.tenant_id" },
                "Retry": [{ "ErrorEquals": ["Lambda.ServiceException", "Lambda.AWSLambdaException", "Lambda.SdkClientException", "Lambda.TooManyRequestsException"], "IntervalSeconds": 2, "BackoffRate": 2, "MaxAttempts": 3 }],
                "Catch": [{ "ErrorEquals": ["States.ALL"], "ResultPath": "$.error", "Next": "MarkFailed" }],
                "Next": "NotifyResult"
              },
              "MarkFailed": {
                "Type": "Task", "Resource": "${BatchWorkflowArn}", "TimeoutSeconds": 60,
                "Parameters": { "mode": "MARK_FAILED", "job_id.$": "$.job_id", "tenant_id.$": "$.tenant_id", "error.$": "$.error" },
                "Retry": [{ "ErrorEquals": ["States.ALL"], "IntervalSeconds": 2, "BackoffRate": 2, "MaxAttempts": 3 }],
                "Next": "NotifyResult"
              },
              "NotifyResult": {
                "Type": "Choice",
                "Choices": [{ "Variable": "$.send_email", "BooleanEquals": true, "Next": "CreateTenantResultTopic" }],
                "Default": "FinishWorkflow"
              },
              "CreateTenantResultTopic": {
                "Type": "Task", "Resource": "arn:${AWS::Partition}:states:::aws-sdk:sns:createTopic",
                "Parameters": { "Name.$": "States.Format('translateme-batch-${StageName}-{}', $.tenant_id)" },
                "ResultPath": "$.sns_topic", "Next": "SubscribeTenantEmail",
                "Catch": [{ "ErrorEquals": ["States.ALL"], "ResultPath": "$.notification_error", "Next": "FinishWorkflow" }]
              },
              "SubscribeTenantEmail": {
                "Type": "Task", "Resource": "arn:${AWS::Partition}:states:::aws-sdk:sns:subscribe",
                "Parameters": { "TopicArn.$": "$.sns_topic.TopicArn", "Protocol": "email", "Endpoint.$": "$.notification_email", "ReturnSubscriptionArn": true },
                "ResultPath": "$.sns_subscription", "Next": "PublishResultEmail",
                "Catch": [{ "ErrorEquals": ["States.ALL"], "ResultPath": "$.notification_error", "Next": "FinishWorkflow" }]
              },
              "PublishResultEmail": {
                "Type": "Task", "Resource": "arn:${AWS::Partition}:states:::aws-sdk:sns:publish",
                "Parameters": {
                  "TopicArn.$": "$.sns_topic.TopicArn",
                  "Subject.$": "States.Format('TranslateMe batch {}', $.status)",
                  "Message.$": "States.JsonToString($)",
                  "MessageAttributes": { "tenant_id": { "DataType": "String", "StringValue.$": "$.tenant_id" } }
                },
                "ResultPath": null, "Next": "FinishWorkflow",
                "Catch": [{ "ErrorEquals": ["States.ALL"], "ResultPath": "$.notification_error", "Next": "FinishWorkflow" }]
              },
              "FinishWorkflow": {
                "Type": "Choice",
                "Choices": [{ "Variable": "$.status", "StringEquals": "FAILED", "Next": "Failed" }],
                "Default": "Succeeded"
              },
              "Succeeded": { "Type": "Succeed" },
              "Failed": { "Type": "Fail", "Error": "BatchFailed", "Cause": "Xem lý do trong bản ghi JOB" }
            }
          }
        - BatchWorkflowArn: !GetAtt BatchWorkflowFunction.Arn

  PlatformFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'translateme-${StageName}-platform-api'
      Runtime: nodejs22.x
      Handler: !Ref PlatformHandler
      Role: !Ref PlatformRoleArn
      Timeout: 60
      MemorySize: 512
      Code: { S3Bucket: !Ref ArtifactBucket, S3Key: !Ref PlatformCodeKey }
      Environment:
        Variables:
          TABLE_NAME: !Ref TableName
          CLOUDFRONT_DISTRIBUTION_ID: !Ref CloudFrontDistributionId
          TENANT_DATA_ACCESS_ROLE_ARN: !Ref TenantDataAccessRoleArn

  PostConfirmationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'translateme-${StageName}-post-confirmation'
      Runtime: nodejs22.x
      Handler: !Ref PostConfirmationHandler
      Role: !Ref PostConfirmationRoleArn
      Timeout: 30
      MemorySize: 256
      Code: { S3Bucket: !Ref ArtifactBucket, S3Key: !Ref PostConfirmationCodeKey }
      Environment:
        Variables:
          TABLE_NAME: !Ref TableName
          TENANT_DATA_ACCESS_ROLE_ARN: !Ref TenantDataAccessRoleArn

  CognitoInvokePostConfirmation:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PostConfirmationFunction
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !Ref UserPoolArn

Outputs:
  ProxyFunctionArn:
    Value: !GetAtt ProxyFunction.Arn
  WorkerFunctionArn:
    Value: !GetAtt WorkerFunction.Arn
  ConsoleFunctionArn:
    Value: !GetAtt ConsoleFunction.Arn
  TranslateFunctionArn:
    Value: !GetAtt TranslateFunction.Arn
  BatchWorkflowFunctionArn:
    Value: !GetAtt BatchWorkflowFunction.Arn
  BatchStateMachineArn:
    Value: !Ref BatchStateMachine
  PlatformFunctionArn:
    Value: !GetAtt PlatformFunction.Arn
  PostConfirmationFunctionArn:
    Value: !GetAtt PostConfirmationFunction.Arn

