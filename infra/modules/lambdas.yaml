AWSTemplateFormatVersion: '2010-09-09'
Description: TranslateMe application Lambda functions, wired to the least-privilege IAM role outputs.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3

Parameters:
  ArtifactBucket:
    Type: String
  ProxyCodeKey:
    Type: String
  WorkerCodeKey:
    Type: String
  ConsoleCodeKey:
    Type: String
  TranslateCodeKey:
    Type: String
  PlatformCodeKey:
    Type: String
  PostConfirmationCodeKey:
    Type: String
  WebsiteCodeKey:
    Type: String
  TableName:
    Type: String
  PayloadBucketName:
    Type: String
  BatchUploadBucketName:
    Type: String
  PayloadBucketArn:
    Type: String
  KmsKeyArn:
    Type: String
  BatchUploadBucketArn:
    Type: String
  BatchUploadKmsKeyArn:
    Type: String
  BasicUsagePlanId:
    Type: String
  StandardUsagePlanId:
    Type: String
  UserPoolArn:
    Type: String
  CloudFrontDistributionId:
    Type: String
  WorkerFunctionArn:
    Type: String
    Description: Same ARN supplied to the IAM stack's WorkerFunctionArn parameter.
  TenantDataAccessRoleArn:
    Type: String
  TenantWebsiteDataAccessRoleArn:
    Type: String
  TenantPayloadRoleArn:
    Type: String
  ProxyRoleArn:
    Type: String
  WorkerRoleArn:
    Type: String
  ConsoleRoleArn:
    Type: String
  TranslateRoleArn:
    Type: String
  PlatformRoleArn:
    Type: String
  PostConfirmationRoleArn:
    Type: String
  WebsiteRoleArn:
    Type: String
  ProxyHandler:
    Type: String
    Default: services/proxy/handler.handler
  WorkerHandler:
    Type: String
    Default: services/proxy/worker.handler
  ConsoleHandler:
    Type: String
    Default: services/api/console/handler.handler
    Description: Unified Console API router (services/api/console/handler.ts) dispatching all /console/* routes (review, glossary, sites, members). Can be overridden to a dedicated handler (e.g. services/api/review/reviewManager.reviewLambdaHandler) if deploying routes to separate Lambdas.
  TranslateHandler:
    Type: String
    Default: services/api/translate/realtime.handler
  PlatformHandler:
    Type: String
    Default: services/api/platform/handler.handler
  PostConfirmationHandler:
    Type: String
    Default: services/api/auth/postConfirmation.handler
  StageName:
    Type: String
    Default: dev
    AllowedPattern: '[A-Za-z0-9_-]+'
  TranslateConcurrency:
    Type: Number
    Default: 4
    MinValue: 1
    MaxValue: 10
  PublicBaseUrl:
    Type: String
    Default: ''
    Description: Địa chỉ công khai của bản dịch (CloudFront hoặc tên miền riêng, ví dụ https://dxxxx.cloudfront.net), dùng cho canonical/hreflang. Truyền từ stack edge để tránh vòng phụ thuộc CloudFront -> Function URL -> Lambda.
  StateCacheSeconds:
    Type: Number
    Default: 30
    MinValue: 0
    MaxValue: 60
    Description: STATE_CACHE_S (QC-10) – thời gian proxy/worker/prewarm giữ trạng thái website và tenant trong bộ nhớ. Đặt 30 để khoá tenant có hiệu lực trong 60 giây kể cả khi cộng thời gian xoá cache CloudFront (KB5 L4).

Resources:
  ProxyFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'translateme-${StageName}-proxy'
      Runtime: nodejs22.x
      Handler: !Ref ProxyHandler
      Role: !Ref ProxyRoleArn
      # QC-10: ngân sách dịch 20 s + tải trang/ráp HTML; CloudFront chỉ chờ origin 30 s nên Lambda phải dừng trước.
      Timeout: 25
      MemorySize: 1024
      Code: { S3Bucket: !Ref ArtifactBucket, S3Key: !Ref ProxyCodeKey }
      Environment:
        Variables:
          PUBLIC_BASE_URL: !Ref PublicBaseUrl
          TRANSLATE_BUDGET_MS: '20000'
          TRANSLATE_CONCURRENCY: !Ref TranslateConcurrency
          STATE_CACHE_S: !Ref StateCacheSeconds
          TABLE_NAME: !Ref TableName
          WORKER_PAYLOAD_BUCKET: !Ref PayloadBucketName
          WORKER_FUNCTION_NAME: !Ref WorkerFunctionArn
          TENANT_DATA_ACCESS_ROLE_ARN: !Ref TenantDataAccessRoleArn
          TENANT_PAYLOAD_BUCKET_ARN: !Ref PayloadBucketArn
          TENANT_PAYLOAD_ROLE_ARN: !Ref TenantPayloadRoleArn
          DATA_KMS_KEY_ARN: !Ref KmsKeyArn

  WorkerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'translateme-${StageName}-worker'
      Runtime: nodejs22.x
      Handler: !Ref WorkerHandler
      Role: !Ref WorkerRoleArn
      # WORKER_BUDGET_MS mặc định 240 000 ms; cộng thời gian ghi TM và quyết toán hạn mức.
      Timeout: 270
      MemorySize: 1024
      Code: { S3Bucket: !Ref ArtifactBucket, S3Key: !Ref WorkerCodeKey }
      Environment:
        Variables:
          STATE_CACHE_S: !Ref StateCacheSeconds
          TABLE_NAME: !Ref TableName
          WORKER_PAYLOAD_BUCKET: !Ref PayloadBucketName
          TENANT_DATA_ACCESS_ROLE_ARN: !Ref TenantDataAccessRoleArn
          TENANT_PAYLOAD_BUCKET_ARN: !Ref PayloadBucketArn
          TENANT_PAYLOAD_ROLE_ARN: !Ref TenantPayloadRoleArn
          DATA_KMS_KEY_ARN: !Ref KmsKeyArn

  ConsoleFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'translateme-${StageName}-console-api'
      Runtime: nodejs22.x
      Handler: !Ref ConsoleHandler
      Role: !Ref ConsoleRoleArn
      Timeout: 30
      MemorySize: 512
      Code: { S3Bucket: !Ref ArtifactBucket, S3Key: !Ref ConsoleCodeKey }
      Environment:
        Variables:
          TABLE_NAME: !Ref TableName
          USER_POOL_ARN: !Ref UserPoolArn
          CLOUDFRONT_DISTRIBUTION_ID: !Ref CloudFrontDistributionId
          TENANT_DATA_ACCESS_ROLE_ARN: !Ref TenantDataAccessRoleArn
          BASIC_USAGE_PLAN_ID: !Ref BasicUsagePlanId
          STANDARD_USAGE_PLAN_ID: !Ref StandardUsagePlanId
          PREWARM_STATE_MACHINE_ARN: !Sub 'arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:translateme-${StageName}-prewarm'
          DATA_KMS_KEY_ARN: !Ref KmsKeyArn

  WebsiteFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'translateme-${StageName}-website-api'
      Runtime: nodejs22.x
      Handler: services/api/sites/handler.handler
      Role: !Ref WebsiteRoleArn
      Timeout: 60
      MemorySize: 512
      Code: { S3Bucket: !Ref ArtifactBucket, S3Key: !Ref WebsiteCodeKey }
      Environment:
        Variables:
          TABLE_NAME: !Ref TableName
          TENANT_DATA_ACCESS_ROLE_ARN: !Ref TenantDataAccessRoleArn
          TENANT_WEBSITE_DATA_ACCESS_ROLE_ARN: !Ref TenantWebsiteDataAccessRoleArn
          ALLOW_PLATFORM_SLUG_RESERVATION: 'true'
          CLOUDFRONT_DISTRIBUTION_ID: !Ref CloudFrontDistributionId
          DATA_KMS_KEY_ARN: !Ref KmsKeyArn

  TranslateFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'translateme-${StageName}-translate-api'
      Runtime: nodejs22.x
      Handler: !Ref TranslateHandler
      Role: !Ref TranslateRoleArn
      Timeout: 60
      MemorySize: 1024
      Code: { S3Bucket: !Ref ArtifactBucket, S3Key: !Ref TranslateCodeKey }
      Environment:
        Variables:
          TABLE_NAME: !Ref TableName
          BATCH_UPLOAD_BUCKET: !Ref BatchUploadBucketName
          TENANT_DATA_ACCESS_ROLE_ARN: !Ref TenantDataAccessRoleArn
          TENANT_BATCH_UPLOAD_BUCKET_ARN: !Ref BatchUploadBucketArn
          TENANT_BATCH_UPLOAD_KMS_KEY_ARN: !Ref BatchUploadKmsKeyArn
          DATA_KMS_KEY_ARN: !Ref KmsKeyArn
          BATCH_STATE_MACHINE_ARN: !Sub 'arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:translateme-${StageName}-batch'
          TRANSLATE_CONCURRENCY: !Ref TranslateConcurrency

  BatchWorkflowFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'translateme-${StageName}-batch-workflow'
      Runtime: nodejs22.x
      Handler: services/api/batch/batchWorkflow.handler
      Role: !Ref TranslateRoleArn
      Timeout: 300
      MemorySize: 1024
      Code: { S3Bucket: !Ref ArtifactBucket, S3Key: !Ref TranslateCodeKey }
      Environment:
        Variables:
          TABLE_NAME: !Ref TableName
          BATCH_UPLOAD_BUCKET: !Ref BatchUploadBucketName
          TENANT_DATA_ACCESS_ROLE_ARN: !Ref TenantDataAccessRoleArn
          TENANT_BATCH_UPLOAD_BUCKET_ARN: !Ref BatchUploadBucketArn
          TENANT_BATCH_UPLOAD_KMS_KEY_ARN: !Ref BatchUploadKmsKeyArn

  BatchStateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'translateme-${StageName}-batch-sfn'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: states.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invoke-batch-workflow
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt BatchWorkflowFunction.Arn
              - Effect: Allow
                Action: sns:CreateTopic
                Resource: !Sub 'arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:translateme-batch-${StageName}-*'
              - Effect: Allow
                Action: sns:Subscribe
                Resource: !Sub 'arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:translateme-batch-${StageName}-*'
                Condition:
                  StringEquals:
                    sns:Protocol: email
              - Effect: Allow
                Action: sns:Publish
                Resource: !Sub 'arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:translateme-batch-${StageName}-*'

  BatchStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub 'translateme-${StageName}-batch'
      StateMachineType: STANDARD
      RoleArn: !GetAtt BatchStateMachineRole.Arn
      DefinitionString: !Sub
        - |-
          {
            "Comment": "TranslateMe F10 batch: parse, translate bounded lots and assemble results.",
            "StartAt": "ParseAndChunk",
            "States": {
              "ParseAndChunk": {
                "Type": "Task", "Resource": "${BatchWorkflowArn}", "TimeoutSeconds": 300,
                "Parameters": { "mode": "PARSE_AND_CHUNK", "job_id.$": "$.job_id", "tenant_id.$": "$.tenant_id" },
                "Retry": [{ "ErrorEquals": ["Lambda.ServiceException", "Lambda.AWSLambdaException", "Lambda.SdkClientException", "Lambda.TooManyRequestsException"], "IntervalSeconds": 2, "BackoffRate": 2, "MaxAttempts": 3 }],
                "Catch": [{ "ErrorEquals": ["States.ALL"], "ResultPath": "$.error", "Next": "MarkFailed" }],
                "Next": "TranslateLots"
              },
              "TranslateLots": {
                "Type": "Map", "ItemsPath": "$.lot_keys", "MaxConcurrency": 5,
                "ItemSelector": { "job_id.$": "$.job_id", "tenant_id.$": "$.tenant_id", "target_langs.$": "$.target_langs", "lot_key.$": "$$.Map.Item.Value" },
                "ItemProcessor": {
                  "ProcessorConfig": { "Mode": "INLINE" }, "StartAt": "TranslateLanguages",
                  "States": {
                    "TranslateLanguages": {
                      "Type": "Map", "ItemsPath": "$.target_langs", "MaxConcurrency": 1,
                      "ItemSelector": { "job_id.$": "$.job_id", "tenant_id.$": "$.tenant_id", "lot_key.$": "$.lot_key", "target_lang.$": "$$.Map.Item.Value" },
                      "ItemProcessor": {
                        "ProcessorConfig": { "Mode": "INLINE" }, "StartAt": "TranslateLot",
                        "States": {
                          "TranslateLot": {
                            "Type": "Task", "Resource": "${BatchWorkflowArn}", "TimeoutSeconds": 300,
                            "Parameters": { "mode": "TRANSLATE_LOT", "job_id.$": "$.job_id", "tenant_id.$": "$.tenant_id", "lot_key.$": "$.lot_key", "target_lang.$": "$.target_lang", "attempt.$": "$$.State.RetryCount" },
                            "Retry": [{ "ErrorEquals": ["ThrottlingException", "TooManyRequestsException", "Lambda.ServiceException", "Lambda.AWSLambdaException", "Lambda.SdkClientException", "BatchTranslationIncomplete"], "IntervalSeconds": 2, "BackoffRate": 2, "MaxAttempts": 3 }],
                            "End": true
                          }
                        }
                      },
                      "ResultPath": null,
                      "End": true
                    }
                  }
                },
                "ResultPath": null,
                "Catch": [{ "ErrorEquals": ["States.ALL"], "ResultPath": "$.error", "Next": "MarkFailed" }],
                "Next": "MergeAndWrite"
              },
              "MergeAndWrite": {
                "Type": "Task", "Resource": "${BatchWorkflowArn}", "TimeoutSeconds": 300,
                "Parameters": { "mode": "MERGE_AND_WRITE", "job_id.$": "$.job_id", "tenant_id.$": "$.tenant_id" },
                "Retry": [{ "ErrorEquals": ["Lambda.ServiceException", "Lambda.AWSLambdaException", "Lambda.SdkClientException", "Lambda.TooManyRequestsException"], "IntervalSeconds": 2, "BackoffRate": 2, "MaxAttempts": 3 }],
                "Catch": [{ "ErrorEquals": ["States.ALL"], "ResultPath": "$.error", "Next": "MarkFailed" }],
                "Next": "NotifyResult"
              },
              "MarkFailed": {
                "Type": "Task", "Resource": "${BatchWorkflowArn}", "TimeoutSeconds": 60,
                "Parameters": { "mode": "MARK_FAILED", "job_id.$": "$.job_id", "tenant_id.$": "$.tenant_id", "error.$": "$.error" },
                "Retry": [{ "ErrorEquals": ["States.ALL"], "IntervalSeconds": 2, "BackoffRate": 2, "MaxAttempts": 3 }],
                "Next": "NotifyResult"
              },
              "NotifyResult": {
                "Type": "Choice",
                "Choices": [{ "Variable": "$.send_email", "BooleanEquals": true, "Next": "CreateTenantResultTopic" }],
                "Default": "FinishWorkflow"
              },
              "CreateTenantResultTopic": {
                "Type": "Task", "Resource": "arn:${AWS::Partition}:states:::aws-sdk:sns:createTopic",
                "Parameters": { "Name.$": "States.Format('translateme-batch-${StageName}-{}', $.tenant_id)" },
                "ResultPath": "$.sns_topic", "Next": "SubscribeTenantEmail",
                "Catch": [{ "ErrorEquals": ["States.ALL"], "ResultPath": "$.notification_error", "Next": "RecordNotificationFailure" }]
              },
              "SubscribeTenantEmail": {
                "Type": "Task", "Resource": "arn:${AWS::Partition}:states:::aws-sdk:sns:subscribe",
                "Parameters": { "TopicArn.$": "$.sns_topic.TopicArn", "Protocol": "email", "Endpoint.$": "$.notification_email", "ReturnSubscriptionArn": true },
                "ResultPath": "$.sns_subscription", "Next": "PublishResultEmail",
                "Catch": [{ "ErrorEquals": ["States.ALL"], "ResultPath": "$.notification_error", "Next": "RecordNotificationFailure" }]
              },
              "PublishResultEmail": {
                "Type": "Task", "Resource": "arn:${AWS::Partition}:states:::aws-sdk:sns:publish",
                "Parameters": {
                  "TopicArn.$": "$.sns_topic.TopicArn",
                  "Subject.$": "States.Format('TranslateMe batch {}', $.status)",
                  "Message.$": "States.JsonToString($)",
                  "MessageAttributes": { "tenant_id": { "DataType": "String", "StringValue.$": "$.tenant_id" } }
                },
                "ResultPath": null, "Next": "RecordNotificationSuccess",
                "Catch": [{ "ErrorEquals": ["States.ALL"], "ResultPath": "$.notification_error", "Next": "RecordNotificationFailure" }]
              },
              "RecordNotificationFailure": {
                "Type": "Task", "Resource": "${BatchWorkflowArn}",
                "Parameters": {
                  "mode": "SET_NOTIFICATION_STATUS",
                  "job_id.$": "$.job_id",
                  "tenant_id.$": "$.tenant_id",
                  "notification_status": "FAILED",
                  "notification_error.$": "$.notification_error"
                },
                "Next": "FinishWorkflow"
              },
              "RecordNotificationSuccess": {
                "Type": "Task", "Resource": "${BatchWorkflowArn}",
                "Parameters": {
                  "mode": "SET_NOTIFICATION_STATUS",
                  "job_id.$": "$.job_id",
                  "tenant_id.$": "$.tenant_id",
                  "notification_status": "SUBMITTED"
                },
                "Next": "FinishWorkflow"
              },
              "FinishWorkflow": {
                "Type": "Choice",
                "Choices": [{ "Variable": "$.status", "StringEquals": "FAILED", "Next": "Failed" }],
                "Default": "Succeeded"
              },
              "Succeeded": { "Type": "Succeed" },
              "Failed": { "Type": "Fail", "Error": "BatchFailed", "Cause": "Xem lý do trong bản ghi JOB" }
            }
          }
        - BatchWorkflowArn: !GetAtt BatchWorkflowFunction.Arn

  # ---------------------------------------------------------------------------
  # F6 – Dịch trước (PREWARM, Task 4.5). Bốn bước chạy cùng gói mã proxy (prewarm.ts dùng lõi F2) với vai trò
  # của worker C13: tra website qua TENANT#PLATFORM#SLUG#, assume TenantDataAccessRole / TenantPayloadAccessRole,
  # gọi Translate. Định nghĩa state machine giống hệt infra/statemachines/prewarm.asl.json
  # (services/proxy/test/prewarm.test.ts kiểm tra hai bản khớp nhau).
  # ---------------------------------------------------------------------------
  ReadSitemapFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'translateme-${StageName}-prewarm-read-sitemap'
      Runtime: nodejs22.x
      Handler: services/proxy/prewarm.readSitemapHandler
      Role: !Ref WorkerRoleArn
      Timeout: 90
      MemorySize: 512
      Code: { S3Bucket: !Ref ArtifactBucket, S3Key: !Ref ProxyCodeKey }
      Environment:
        Variables:
          PUBLIC_BASE_URL: !Ref PublicBaseUrl
          STATE_CACHE_S: !Ref StateCacheSeconds
          TRANSLATE_CONCURRENCY: !Ref TranslateConcurrency
          TABLE_NAME: !Ref TableName
          WORKER_PAYLOAD_BUCKET: !Ref PayloadBucketName
          TENANT_DATA_ACCESS_ROLE_ARN: !Ref TenantDataAccessRoleArn
          TENANT_PAYLOAD_BUCKET_ARN: !Ref PayloadBucketArn
          TENANT_PAYLOAD_ROLE_ARN: !Ref TenantPayloadRoleArn
          DATA_KMS_KEY_ARN: !Ref KmsKeyArn

  PrewarmPagesFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'translateme-${StageName}-prewarm-pages'
      Runtime: nodejs22.x
      Handler: services/proxy/prewarm.prewarmPagesHandler
      Role: !Ref WorkerRoleArn
      # PREWARM_WORKER_BUDGET_MS = 240 s; ASL đặt TimeoutSeconds 300 cho bước này.
      Timeout: 270
      MemorySize: 1024
      Code: { S3Bucket: !Ref ArtifactBucket, S3Key: !Ref ProxyCodeKey }
      Environment:
        Variables:
          PUBLIC_BASE_URL: !Ref PublicBaseUrl
          STATE_CACHE_S: !Ref StateCacheSeconds
          TRANSLATE_CONCURRENCY: !Ref TranslateConcurrency
          TABLE_NAME: !Ref TableName
          WORKER_PAYLOAD_BUCKET: !Ref PayloadBucketName
          TENANT_DATA_ACCESS_ROLE_ARN: !Ref TenantDataAccessRoleArn
          TENANT_PAYLOAD_BUCKET_ARN: !Ref PayloadBucketArn
          TENANT_PAYLOAD_ROLE_ARN: !Ref TenantPayloadRoleArn
          DATA_KMS_KEY_ARN: !Ref KmsKeyArn

  FinishPrewarmFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'translateme-${StageName}-prewarm-finish'
      Runtime: nodejs22.x
      Handler: services/proxy/prewarm.finishPrewarmHandler
      Role: !Ref WorkerRoleArn
      Timeout: 30
      MemorySize: 256
      Code: { S3Bucket: !Ref ArtifactBucket, S3Key: !Ref ProxyCodeKey }
      Environment:
        Variables:
          PUBLIC_BASE_URL: !Ref PublicBaseUrl
          STATE_CACHE_S: !Ref StateCacheSeconds
          TRANSLATE_CONCURRENCY: !Ref TranslateConcurrency
          TABLE_NAME: !Ref TableName
          WORKER_PAYLOAD_BUCKET: !Ref PayloadBucketName
          TENANT_DATA_ACCESS_ROLE_ARN: !Ref TenantDataAccessRoleArn
          TENANT_PAYLOAD_BUCKET_ARN: !Ref PayloadBucketArn
          TENANT_PAYLOAD_ROLE_ARN: !Ref TenantPayloadRoleArn
          DATA_KMS_KEY_ARN: !Ref KmsKeyArn

  MarkPrewarmFailedFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'translateme-${StageName}-prewarm-mark-failed'
      Runtime: nodejs22.x
      Handler: services/proxy/prewarm.markPrewarmFailedHandler
      Role: !Ref WorkerRoleArn
      Timeout: 30
      MemorySize: 256
      Code: { S3Bucket: !Ref ArtifactBucket, S3Key: !Ref ProxyCodeKey }
      Environment:
        Variables:
          PUBLIC_BASE_URL: !Ref PublicBaseUrl
          STATE_CACHE_S: !Ref StateCacheSeconds
          TRANSLATE_CONCURRENCY: !Ref TranslateConcurrency
          TABLE_NAME: !Ref TableName
          WORKER_PAYLOAD_BUCKET: !Ref PayloadBucketName
          TENANT_DATA_ACCESS_ROLE_ARN: !Ref TenantDataAccessRoleArn
          TENANT_PAYLOAD_BUCKET_ARN: !Ref PayloadBucketArn
          TENANT_PAYLOAD_ROLE_ARN: !Ref TenantPayloadRoleArn
          DATA_KMS_KEY_ARN: !Ref KmsKeyArn

  PrewarmStateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'translateme-${StageName}-prewarm-sfn'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: states.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: invoke-prewarm-steps
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !GetAtt ReadSitemapFunction.Arn
                  - !GetAtt PrewarmPagesFunction.Arn
                  - !GetAtt FinishPrewarmFunction.Arn
                  - !GetAtt MarkPrewarmFailedFunction.Arn

  PrewarmStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      # Tên cố định: ConsoleFunction dựng PREWARM_STATE_MACHINE_ARN và iam.yaml cấp states:StartExecution theo tên này.
      StateMachineName: !Sub 'translateme-${StageName}-prewarm'
      StateMachineType: STANDARD
      RoleArn: !GetAtt PrewarmStateMachineRole.Arn
      DefinitionSubstitutions:
        ReadSitemapFunctionArn: !GetAtt ReadSitemapFunction.Arn
        PrewarmPagesFunctionArn: !GetAtt PrewarmPagesFunction.Arn
        FinishPrewarmFunctionArn: !GetAtt FinishPrewarmFunction.Arn
        MarkPrewarmFailedFunctionArn: !GetAtt MarkPrewarmFailedFunction.Arn
      DefinitionString: |-
        {
          "Comment": "TranslateMe PREWARM (F6, Task 4.5): đọc sitemap, Map thường qua các lô URL, worker C13 chế độ trang. Đầu vào M2: {job_id, tenant_id, slug, target_langs}. DefinitionSubstitutions: ReadSitemapFunctionArn, PrewarmPagesFunctionArn, FinishPrewarmFunctionArn, MarkPrewarmFailedFunctionArn.",
          "StartAt": "ReadSitemap",
          "States": {
            "ReadSitemap": {
              "Type": "Task",
              "Resource": "${ReadSitemapFunctionArn}",
              "TimeoutSeconds": 120,
              "Retry": [
                {
                  "ErrorEquals": ["Lambda.ServiceException", "Lambda.AWSLambdaException", "Lambda.SdkClientException", "Lambda.TooManyRequestsException"],
                  "IntervalSeconds": 2,
                  "MaxAttempts": 3,
                  "BackoffRate": 2
                }
              ],
              "Catch": [{ "ErrorEquals": ["States.ALL"], "ResultPath": "$.error", "Next": "MarkFailed" }],
              "Next": "PrewarmLots"
            },
            "PrewarmLots": {
              "Type": "Map",
              "ItemsPath": "$.lots",
              "MaxConcurrency": 2,
              "ItemSelector": {
                "mode": "PREWARM_PAGES",
                "job_id.$": "$.job_id",
                "tenant_id.$": "$.tenant_id",
                "slug.$": "$.slug",
                "target_langs.$": "$.target_langs",
                "urls_key.$": "$$.Map.Item.Value"
              },
              "ItemProcessor": {
                "ProcessorConfig": { "Mode": "INLINE" },
                "StartAt": "PrewarmPages",
                "States": {
                  "PrewarmPages": {
                    "Type": "Task",
                    "Resource": "${PrewarmPagesFunctionArn}",
                    "TimeoutSeconds": 300,
                    "Retry": [
                      {
                        "ErrorEquals": ["Lambda.ServiceException", "Lambda.AWSLambdaException", "Lambda.SdkClientException", "Lambda.TooManyRequestsException"],
                        "IntervalSeconds": 5,
                        "MaxAttempts": 3,
                        "BackoffRate": 2
                      }
                    ],
                    "End": true
                  }
                }
              },
              "ResultPath": "$.results",
              "Catch": [{ "ErrorEquals": ["States.ALL"], "ResultPath": "$.error", "Next": "MarkFailed" }],
              "Next": "FinishPrewarm"
            },
            "FinishPrewarm": {
              "Type": "Task",
              "Resource": "${FinishPrewarmFunctionArn}",
              "TimeoutSeconds": 60,
              "Retry": [
                {
                  "ErrorEquals": ["Lambda.ServiceException", "Lambda.AWSLambdaException", "Lambda.SdkClientException", "Lambda.TooManyRequestsException"],
                  "IntervalSeconds": 2,
                  "MaxAttempts": 3,
                  "BackoffRate": 2
                }
              ],
              "Catch": [{ "ErrorEquals": ["States.ALL"], "ResultPath": "$.error", "Next": "MarkFailed" }],
              "End": true
            },
            "MarkFailed": {
              "Type": "Task",
              "Resource": "${MarkPrewarmFailedFunctionArn}",
              "TimeoutSeconds": 60,
              "Retry": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "IntervalSeconds": 2,
                  "MaxAttempts": 3,
                  "BackoffRate": 2
                }
              ],
              "Next": "Failed"
            },
            "Failed": {
              "Type": "Fail",
              "Error": "PrewarmFailed",
              "Cause": "Xem lý do trong bản ghi JOB"
            }
          }
        }

  PlatformFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'translateme-${StageName}-platform-api'
      Runtime: nodejs22.x
      Handler: !Ref PlatformHandler
      Role: !Ref PlatformRoleArn
      Timeout: 60
      MemorySize: 512
      Code: { S3Bucket: !Ref ArtifactBucket, S3Key: !Ref PlatformCodeKey }
      Environment:
        Variables:
          TABLE_NAME: !Ref TableName
          CLOUDFRONT_DISTRIBUTION_ID: !Ref CloudFrontDistributionId
          TENANT_DATA_ACCESS_ROLE_ARN: !Ref TenantDataAccessRoleArn
          DATA_KMS_KEY_ARN: !Ref KmsKeyArn

  PostConfirmationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'translateme-${StageName}-post-confirmation'
      Runtime: nodejs22.x
      Handler: !Ref PostConfirmationHandler
      Role: !Ref PostConfirmationRoleArn
      Timeout: 30
      MemorySize: 256
      Code: { S3Bucket: !Ref ArtifactBucket, S3Key: !Ref PostConfirmationCodeKey }
      Environment:
        Variables:
          TABLE_NAME: !Ref TableName
          TENANT_DATA_ACCESS_ROLE_ARN: !Ref TenantDataAccessRoleArn
          DATA_KMS_KEY_ARN: !Ref KmsKeyArn

  CognitoInvokePostConfirmation:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PostConfirmationFunction
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !Ref UserPoolArn

Outputs:
  ProxyFunctionArn:
    Value: !GetAtt ProxyFunction.Arn
  WorkerFunctionArn:
    Value: !GetAtt WorkerFunction.Arn
  ConsoleFunctionArn:
    Value: !GetAtt ConsoleFunction.Arn
  TranslateFunctionArn:
    Value: !GetAtt TranslateFunction.Arn
  BatchWorkflowFunctionArn:
    Value: !GetAtt BatchWorkflowFunction.Arn
  BatchStateMachineArn:
    Value: !Ref BatchStateMachine
  PrewarmStateMachineArn:
    Value: !Ref PrewarmStateMachine
  PlatformFunctionArn:
    Value: !GetAtt PlatformFunction.Arn
  PostConfirmationFunctionArn:
    Value: !GetAtt PostConfirmationFunction.Arn
  WebsiteFunctionArn:
    Value: !GetAtt WebsiteFunction.Arn
