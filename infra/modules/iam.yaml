AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  TranslateMe Lambda execution roles. Deploy after the data and identity stacks,
  then pass the role ARN outputs to the Lambda function stack.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3

Parameters:
  TableArn:
    Type: String
    Description: DynamoDB table ARN exported by the data stack.
  UserPoolArn:
    Type: String
    Description: Cognito User Pool ARN used by PostConfirmation and member invitation.
  PayloadBucketArn:
    Type: String
    Description: S3 bucket ARN used for asynchronous proxy payloads.
  KmsKeyArn:
    Type: String
    Description: KMS key ARN used by data stack encrypted resources.
  BatchUploadBucketArn:
    Type: String
    Description: S3 bucket ARN used for tenant batch upload objects.
  BatchUploadKmsKeyArn:
    Type: String
    Description: KMS key ARN used by the encrypted tenant batch bucket.
  WorkerFunctionArn:
    Type: String
    Description: Worker Lambda ARN invoked asynchronously by the proxy.
  CloudFrontDistributionArn:
    Type: String
    Description: CloudFront distribution ARN invalidated by console/platform handlers.
  StageName:
    Type: String
    Default: dev
    AllowedPattern: '[A-Za-z0-9_-]+'

Resources:
  # ─── Threat-model note (tenant isolation) ───────────────────────────
  # SourceIdentity and the TenantId session tag are both caller-supplied.
  # The trust policy only verifies they match each other and that the
  # caller is one of the listed Lambda execution roles. It does NOT
  # independently bind the tenant ID to a source the Lambda cannot
  # choose (e.g. a Cognito identity). Actual tenant isolation relies on
  # the session policy generated by libs/common/tenantAws.ts.
  #
  # The Deny statement below blocks role-chaining: if a caller already
  # carries a TenantId session tag (i.e. is itself an assumed-role
  # session), it cannot assume this role again – preventing a
  # compromised tenant session from pivoting to another tenant.
  # ────────────────────────────────────────────────────────────────────
  TenantDataAccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'translateme-${StageName}-tenant-data'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyRoleChaining
            Effect: Deny
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action:
              - sts:AssumeRole
              - sts:SetSourceIdentity
              - sts:TagSession
            Condition:
              StringLike:
                aws:PrincipalTag/TenantId: '*'
          # Tách theo mẫu AWS khuyến nghị: điều kiện session tag cho AssumeRole/TagSession, điều kiện source identity
          # cho SetSourceIdentity. Bản cũ so khớp aws:RequestTag/TenantId với biến ${sts:SourceIdentity} trong một câu lệnh
          # gộp 3 action; trên AWS thật STS trả AccessDenied (deploy dev 14/11). Lambda luôn đặt SourceIdentity = tag
          # TenantId (tenantAws.ts); phạm vi dữ liệu do session policy và aws:PrincipalTag/TenantId giới hạn.
          - Sid: AssumeWithTenantSessionTag
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action:
              - sts:AssumeRole
              - sts:TagSession
            Condition:
              ArnLike:
                aws:PrincipalArn:
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/translateme-${StageName}-proxy'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/translateme-${StageName}-worker'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/translateme-${StageName}-console-api'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/translateme-${StageName}-website-api'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/translateme-${StageName}-translate-api'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/translateme-${StageName}-platform-api'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/translateme-${StageName}-post-confirmation'
              StringLike:
                aws:RequestTag/TenantId: 't_*'
              ForAllValues:StringEquals:
                aws:TagKeys:
                  - TenantId
          - Sid: SetTenantSourceIdentity
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: sts:SetSourceIdentity
            Condition:
              ArnLike:
                aws:PrincipalArn:
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/translateme-${StageName}-proxy'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/translateme-${StageName}-worker'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/translateme-${StageName}-console-api'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/translateme-${StageName}-website-api'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/translateme-${StageName}-translate-api'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/translateme-${StageName}-platform-api'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/translateme-${StageName}-post-confirmation'
              StringLike:
                sts:SourceIdentity: 't_*'
      Policies:
        - PolicyName: tenant-data-session-maximum
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: TenantPartitionDataAccess
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:BatchGetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:ConditionCheckItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:TransactWriteItems
                Resource:
                  - !Ref TableArn
                  - !Sub '${TableArn}/index/GSI2'
                  - !Sub '${TableArn}/index/GSI3'
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys:
                      - 'TENANT#${aws:PrincipalTag/TenantId}'
                      - 'TENANT#${aws:PrincipalTag/TenantId}#*'
                      # KEYMAP của API key (TENANT#PLATFORM#KEY#<keyId>) ghi cùng giao dịch với APIKEY của tenant.
                      # Session policy chỉ thêm đúng một khóa này khi Lambda Console bật ALLOW_PLATFORM_KEY_MAPPING,
                      # nên quyền thực tế (giao của role và session policy) của các Lambda khác không đổi.
                      - 'TENANT#PLATFORM#KEY#*'
                  'Null':
                    dynamodb:LeadingKeys: 'false'
              - Sid: TenantBatchObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource:
                  - !Sub '${BatchUploadBucketArn}/batch/${!aws:PrincipalTag/TenantId}/input/*'
                  - !Sub '${BatchUploadBucketArn}/batch/${!aws:PrincipalTag/TenantId}/results/*'
              - Sid: TenantDataKmsUse
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:Encrypt
                  - kms:ReEncrypt*
                  - kms:GenerateDataKey*
                  - kms:DescribeKey
                  - kms:CreateGrant
                Resource: !Ref KmsKeyArn
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 'dynamodb.${AWS::Region}.amazonaws.com'
                    kms:EncryptionContext:aws:dynamodb:tableName: !Select [1, !Split ['/', !Ref TableArn]]
                    kms:EncryptionContext:aws:dynamodb:subscriberId: !Ref AWS::AccountId
              - Sid: TenantBatchKmsAccess
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource: !Ref BatchUploadKmsKeyArn
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 's3.${AWS::Region}.amazonaws.com'
                    kms:EncryptionContext:aws:s3:arn: !Ref BatchUploadBucketArn

  TenantPayloadAccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'translateme-${StageName}-tenant-payload'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyRoleChaining
            Effect: Deny
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action:
              - sts:AssumeRole
              - sts:TagSession
              - sts:SetSourceIdentity
            Condition:
              StringLike:
                aws:PrincipalTag/TenantId: '*'
          # Tách theo mẫu AWS khuyến nghị: điều kiện session tag cho AssumeRole/TagSession, điều kiện source identity
          # cho SetSourceIdentity. Bản cũ so khớp aws:RequestTag/TenantId với biến ${sts:SourceIdentity} trong một câu lệnh
          # gộp 3 action; trên AWS thật STS trả AccessDenied (deploy dev 14/11). Lambda luôn đặt SourceIdentity = tag
          # TenantId (tenantAws.ts); phạm vi dữ liệu do session policy và aws:PrincipalTag/TenantId giới hạn.
          - Sid: AssumeWithTenantSessionTag
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action:
              - sts:AssumeRole
              - sts:TagSession
            Condition:
              ArnLike:
                aws:PrincipalArn:
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/translateme-${StageName}-proxy'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/translateme-${StageName}-worker'
              StringLike:
                aws:RequestTag/TenantId: 't_*'
              ForAllValues:StringEquals:
                aws:TagKeys:
                  - TenantId
          - Sid: SetTenantSourceIdentity
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: sts:SetSourceIdentity
            Condition:
              ArnLike:
                aws:PrincipalArn:
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/translateme-${StageName}-proxy'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/translateme-${StageName}-worker'
              StringLike:
                sts:SourceIdentity: 't_*'
      Policies:
        - PolicyName: tenant-worker-payload-maximum
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: TenantWorkerPayloadObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub '${PayloadBucketArn}/tenant/${!aws:PrincipalTag/TenantId}/worker/*'
              - Sid: PayloadKmsUse
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource: !Ref KmsKeyArn
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 's3.${AWS::Region}.amazonaws.com'
                    kms:EncryptionContext:aws:s3:arn: !Ref PayloadBucketArn

  TenantWebsiteDataAccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'translateme-${StageName}-tenant-website-data'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyRoleChaining
            Effect: Deny
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action:
              - sts:AssumeRole
              - sts:TagSession
              - sts:SetSourceIdentity
            Condition:
              StringLike:
                aws:PrincipalTag/TenantId: '*'
          # Tách theo mẫu AWS khuyến nghị: điều kiện session tag cho AssumeRole/TagSession, điều kiện source identity
          # cho SetSourceIdentity. Bản cũ so khớp aws:RequestTag/TenantId với biến ${sts:SourceIdentity} trong một câu lệnh
          # gộp 3 action; trên AWS thật STS trả AccessDenied (deploy dev 14/11). Lambda luôn đặt SourceIdentity = tag
          # TenantId (tenantAws.ts); phạm vi dữ liệu do session policy và aws:PrincipalTag/TenantId giới hạn.
          - Sid: AssumeWithTenantSessionTag
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action:
              - sts:AssumeRole
              - sts:TagSession
            Condition:
              ArnLike:
                aws:PrincipalArn: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/translateme-${StageName}-website-api'
              StringLike:
                aws:RequestTag/TenantId: 't_*'
              ForAllValues:StringEquals:
                aws:TagKeys:
                  - TenantId
          - Sid: SetTenantSourceIdentity
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: sts:SetSourceIdentity
            Condition:
              ArnLike:
                aws:PrincipalArn: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/translateme-${StageName}-website-api'
              StringLike:
                sts:SourceIdentity: 't_*'
      Policies:
        - PolicyName: website-tenant-slug-transaction
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WebsiteTenantAndSlugTransaction
                Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:ConditionCheckItem
                  - dynamodb:TransactWriteItems
                Resource: !Ref TableArn
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys:
                      - 'TENANT#${aws:PrincipalTag/TenantId}'
                      - 'TENANT#${aws:PrincipalTag/TenantId}#*'
                      - 'TENANT#PLATFORM#SLUG#*'
              - Sid: WebsiteTenantDataKmsUse
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:Encrypt
                  - kms:ReEncrypt*
                  - kms:GenerateDataKey*
                  - kms:DescribeKey
                  - kms:CreateGrant
                Resource: !Ref KmsKeyArn
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 'dynamodb.${AWS::Region}.amazonaws.com'
                    kms:EncryptionContext:aws:dynamodb:tableName: !Select [1, !Split ['/', !Ref TableArn]]
                    kms:EncryptionContext:aws:dynamodb:subscriberId: !Ref AWS::AccountId

  ProxyExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'translateme-${StageName}-proxy'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: proxy-runtime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadPlatformMappings
                Effect: Allow
                Action: dynamodb:GetItem
                Resource: !Ref TableArn
                Condition:
                  StringLike:
                    dynamodb:LeadingKeys:
                      - 'TENANT#PLATFORM#SLUG#*'
              # Bảng dùng KMS key tự quản lý: đọc trực tiếp bằng role thực thi (không qua phiên tenant) cũng cần
              # kms:Decrypt; thiếu quyền này GetItem trả AccessDeniedException (deploy dev 14/11).
              - Sid: ReadPlatformMappingsKms
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                Resource: !Ref KmsKeyArn
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 'dynamodb.${AWS::Region}.amazonaws.com'
                    kms:EncryptionContext:aws:dynamodb:tableName: !Select [1, !Split ['/', !Ref TableArn]]
                    kms:EncryptionContext:aws:dynamodb:subscriberId: !Ref AWS::AccountId
              - Sid: AssumeTenantDataAccessRole
                Effect: Allow
                Action:
                  - sts:AssumeRole
                  - sts:SetSourceIdentity
                  - sts:TagSession
                Resource: !GetAtt TenantDataAccessRole.Arn
              - Sid: InvokeAsyncWorker
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Ref WorkerFunctionArn
              - Sid: TranslationServices
                Effect: Allow
                Action:
                  - translate:TranslateText
                  - comprehend:DetectDominantLanguage
                Resource: '*'
              - Sid: AssumeTenantPayloadAccessRole
                Effect: Allow
                Action:
                  - sts:AssumeRole
                  - sts:TagSession
                  - sts:SetSourceIdentity
                Resource: !GetAtt TenantPayloadAccessRole.Arn

  WorkerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'translateme-${StageName}-worker'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: worker-runtime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadPlatformSlugMapping
                Effect: Allow
                Action: dynamodb:GetItem
                Resource: !Ref TableArn
                Condition:
                  StringLike:
                    dynamodb:LeadingKeys: 'TENANT#PLATFORM#SLUG#*'
              # Bảng dùng KMS key tự quản lý: đọc trực tiếp bằng role thực thi (không qua phiên tenant) cũng cần
              # kms:Decrypt; thiếu quyền này GetItem trả AccessDeniedException (deploy dev 14/11).
              - Sid: ReadPlatformSlugMappingKms
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                Resource: !Ref KmsKeyArn
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 'dynamodb.${AWS::Region}.amazonaws.com'
                    kms:EncryptionContext:aws:dynamodb:tableName: !Select [1, !Split ['/', !Ref TableArn]]
                    kms:EncryptionContext:aws:dynamodb:subscriberId: !Ref AWS::AccountId
              - Sid: AssumeTenantDataAccessRole
                Effect: Allow
                Action:
                  - sts:AssumeRole
                  - sts:SetSourceIdentity
                  - sts:TagSession
                Resource: !GetAtt TenantDataAccessRole.Arn
              - Sid: TranslateText
                Effect: Allow
                Action: translate:TranslateText
                Resource: '*'
              - Sid: AssumeTenantPayloadAccessRole
                Effect: Allow
                Action:
                  - sts:AssumeRole
                  - sts:TagSession
                  - sts:SetSourceIdentity
                Resource: !GetAtt TenantPayloadAccessRole.Arn

  ConsoleApiExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'translateme-${StageName}-console-api'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: console-api-runtime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # ReserveWebsiteSlug removed: website creation now handled by
              # WebsiteFunctionRole via TenantWebsiteDataAccessRole.
              # Console API no longer needs write access to TENANT#PLATFORM#SLUG#* keys.
              - Sid: AssumeTenantDataAccessRole
                Effect: Allow
                Action:
                  - sts:AssumeRole
                  - sts:SetSourceIdentity
                  - sts:TagSession
                Resource: !GetAtt TenantDataAccessRole.Arn
              - Sid: InviteTenantMembers
                Effect: Allow
                Action:
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminDeleteUser
                Resource: !Ref UserPoolArn
              - Sid: ManageTenantApiKeys
                Effect: Allow
                Action:
                  - apigateway:POST
                  - apigateway:PATCH
                  - apigateway:DELETE
                Resource:
                  - !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}::/apikeys'
                  - !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}::/apikeys/*'
                  - !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}::/usageplans/*/keys'
                  - !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}::/usageplans/*/keys/*'
              - Sid: ImportGlossaryTerminology
                Effect: Allow
                Action: translate:ImportTerminology
                Resource: '*'
              - Sid: InvalidateWebsiteCache
                Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                Resource: !Ref CloudFrontDistributionArn
              - Sid: StartPrewarmExecution
                Effect: Allow
                Action: states:StartExecution
                Resource:
                  - !Sub 'arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:translateme-${StageName}-prewarm'
                  - !Sub 'arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:execution:translateme-${StageName}-prewarm:*'
  WebsiteFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'translateme-${StageName}-website-api'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: website-management
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AssumeTenantDataAccessRole
                Effect: Allow
                Action:
                  - sts:AssumeRole
                  - sts:TagSession
                  - sts:SetSourceIdentity
                Resource: !GetAtt TenantDataAccessRole.Arn
              - Sid: AssumeTenantWebsiteDataAccessRole
                Effect: Allow
                Action:
                  - sts:AssumeRole
                  - sts:TagSession
                  - sts:SetSourceIdentity
                Resource: !GetAtt TenantWebsiteDataAccessRole.Arn
              - Sid: WebsiteCacheInvalidation
                Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                Resource: !Ref CloudFrontDistributionArn

  TranslateApiExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'translateme-${StageName}-translate-api'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: translate-api-runtime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadPlatformKeyMapping
                Effect: Allow
                Action: dynamodb:GetItem
                Resource: !Ref TableArn
                Condition:
                  StringLike:
                    dynamodb:LeadingKeys: 'TENANT#PLATFORM#KEY#*'
              # Bảng dùng KMS key tự quản lý: đọc trực tiếp bằng role thực thi (không qua phiên tenant) cũng cần
              # kms:Decrypt; thiếu quyền này GetItem trả AccessDeniedException (deploy dev 14/11).
              - Sid: ReadPlatformKeyMappingKms
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                Resource: !Ref KmsKeyArn
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 'dynamodb.${AWS::Region}.amazonaws.com'
                    kms:EncryptionContext:aws:dynamodb:tableName: !Select [1, !Split ['/', !Ref TableArn]]
                    kms:EncryptionContext:aws:dynamodb:subscriberId: !Ref AWS::AccountId
              - Sid: AssumeTenantDataAccessRole
                Effect: Allow
                Action:
                  - sts:AssumeRole
                  - sts:SetSourceIdentity
                  - sts:TagSession
                Resource: !GetAtt TenantDataAccessRole.Arn
              - Sid: TranslateText
                Effect: Allow
                Action: translate:TranslateText
                Resource: '*'
              - Sid: DetectSourceLanguage
                Effect: Allow
                Action: comprehend:DetectDominantLanguage
                Resource: '*'
              - Sid: StartBatchExecution
                Effect: Allow
                Action: states:StartExecution
                Resource: !Sub 'arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:translateme-${StageName}-batch'

  PlatformApiExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'translateme-${StageName}-platform-api'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: platform-api-runtime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AssumeTenantDataAccessRole
                Effect: Allow
                Action:
                  - sts:AssumeRole
                  - sts:SetSourceIdentity
                  - sts:TagSession
                Resource: !GetAtt TenantDataAccessRole.Arn
              - Sid: InvalidateWebsiteCache
                Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Ref CloudFrontDistributionArn

  PostConfirmationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'translateme-${StageName}-post-confirmation'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: post-confirmation-runtime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AssumeTenantDataAccessRole
                Effect: Allow
                Action:
                  - sts:AssumeRole
                  - sts:SetSourceIdentity
                  - sts:TagSession
                Resource: !GetAtt TenantDataAccessRole.Arn
              - Sid: SetTenantClaimsOnConfirmedUser
                Effect: Allow
                Action: cognito-idp:AdminUpdateUserAttributes
                Resource: !Ref UserPoolArn

Outputs:
  TenantDataAccessRoleArn:
    Description: Target role assumed with an inline policy scoped to the request tenant.
    Value: !GetAtt TenantDataAccessRole.Arn
  TenantPayloadAccessRoleArn:
    Description: Target role assumed with a session policy scoped to one tenant payload prefix.
    Value: !GetAtt TenantPayloadAccessRole.Arn
  TenantWebsiteDataAccessRoleArn:
    Description: Target role used only for tenant website creation slug transactions.
    Value: !GetAtt TenantWebsiteDataAccessRole.Arn
  ProxyExecutionRoleArn:
    Description: Attach to the website proxy Lambda.
    Value: !GetAtt ProxyExecutionRole.Arn
  WorkerExecutionRoleArn:
    Description: Attach to the asynchronous translation worker Lambda.
    Value: !GetAtt WorkerExecutionRole.Arn
  ConsoleApiExecutionRoleArn:
    Description: Attach to the Console API Lambda (includes member invite and glossary import).
    Value: !GetAtt ConsoleApiExecutionRole.Arn
  WebsiteFunctionRoleArn:
    Description: Attach to the dedicated website management Lambda.
    Value: !GetAtt WebsiteFunctionRole.Arn
  TranslateApiExecutionRoleArn:
    Description: Attach to the API-key translation Lambda.
    Value: !GetAtt TranslateApiExecutionRole.Arn
  PlatformApiExecutionRoleArn:
    Description: Attach to the Platform Admin Lambda.
    Value: !GetAtt PlatformApiExecutionRole.Arn
  PostConfirmationExecutionRoleArn:
    Description: Attach to the Cognito PostConfirmation trigger Lambda.
    Value: !GetAtt PostConfirmationExecutionRole.Arn
