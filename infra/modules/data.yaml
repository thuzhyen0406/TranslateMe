AWSTemplateFormatVersion: "2010-09-09"
Description: TranslateMe - khoa KMS (C11) va bang DynamoDB mot bang (C3)

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3

Parameters:
  TableName:
    Type: String
    Default: TranslateMe
  DeletionProtection:
    Type: String
    Default: "false"          # dat "true" khi len moi truong that
    AllowedValues: ["true", "false"]
  PayloadBucketName:
    Type: String
    Default: ''
    Description: Optional globally unique name for the asynchronous worker payload bucket.

Conditions:
  HasPayloadBucketName: !Not [!Equals [!Ref PayloadBucketName, '']]

Resources:
  DataKey:
    Type: AWS::KMS::Key
    Properties:
      Description: TranslateMe - ma hoa DynamoDB, S3 va CloudWatch Logs
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowAccountAdminViaIAM
            Effect: Allow
            Principal: { AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root" }
            Action: "kms:*"
            Resource: "*"
          - Sid: AllowCloudWatchLogs
            Effect: Allow
            Principal: { Service: !Sub "logs.${AWS::Region}.amazonaws.com" }
            Action:
              - kms:Encrypt*
              - kms:Decrypt*
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:Describe*
            Resource: "*"
            Condition:
              ArnLike:
                "kms:EncryptionContext:aws:logs:arn": !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*"

  DataKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/translateme-data
      TargetKeyId: !Ref DataKey

  WorkerPayloadBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !If [HasPayloadBucketName, !Ref PayloadBucketName, !Ref AWS::NoValue]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt DataKey.Arn
            BucketKeyEnabled: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireWorkerPayloads
            Status: Enabled
            Prefix: tenant/
            ExpirationInDays: 1
            NoncurrentVersionExpiration:
              NoncurrentDays: 1
      Tags:
        - { Key: project, Value: translateme }

  WorkerPayloadBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WorkerPayloadBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt WorkerPayloadBucket.Arn
              - !Sub '${WorkerPayloadBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false
          - Sid: DenyExplicitNonKmsEncryption
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub '${WorkerPayloadBucket.Arn}/*'
            Condition:
              StringNotEquals:
                s3:x-amz-server-side-encryption: aws:kms
          - Sid: DenyMissingKmsEncryptionHeader
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub '${WorkerPayloadBucket.Arn}/*'
            Condition:
              'Null':
                s3:x-amz-server-side-encryption: true
          - Sid: DenyUnapprovedKmsKey
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub '${WorkerPayloadBucket.Arn}/*'
            Condition:
              StringNotEquals:
                s3:x-amz-server-side-encryption-aws-kms-key-id: !GetAtt DataKey.Arn
          - Sid: DenyMissingKmsKeyHeader
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub '${WorkerPayloadBucket.Arn}/*'
            Condition:
              'Null':
                s3:x-amz-server-side-encryption-aws-kms-key-id: true

  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: !Ref DeletionProtection
      AttributeDefinitions:
        - { AttributeName: PK,     AttributeType: S }
        - { AttributeName: SK,     AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
        - { AttributeName: GSI2PK, AttributeType: S }
        - { AttributeName: GSI2SK, AttributeType: S }
        - { AttributeName: GSI3PK, AttributeType: S }
        - { AttributeName: GSI3SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: GSI1            # so lieu Platform Admin: USAGE#YYYY-MM -> TENANT#t
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: GSI2            # cau theo trang: PAGE#lang#path -> HASH#sha256
          KeySchema:
            - { AttributeName: GSI2PK, KeyType: HASH }
            - { AttributeName: GSI2SK, KeyType: RANGE }
          Projection: { ProjectionType: KEYS_ONLY }
        - IndexName: GSI3            # TM theo nhan: TM#tgt#MACHINE|HUMAN|REVIEW -> updatedAt
          KeySchema:
            - { AttributeName: GSI3PK, KeyType: HASH }
            - { AttributeName: GSI3SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !GetAtt DataKey.Arn
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - { Key: project, Value: translateme }

  BatchFilesBucket:
    Type: AWS::S3::Bucket
    Metadata:
      com.aws.cloudformation.Context:
        why: Private encrypted object storage for tenant batch input and result files.
        must:
          - Keep public access blocked and default SSE-KMS encryption enabled.
          - Expire tenant batch objects after seven days.
          - Keep the object key namespace under batch/<tenantId>/.
        mutable: change-with-constraints
    Properties:
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt DataKey.Arn
            BucketKeyEnabled: true
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT]
            AllowedOrigins: ['*']
            AllowedHeaders: [Content-Type]
            MaxAge: 300
      LifecycleConfiguration:
        Rules:
          - Id: ExpireTenantBatchFilesAfterSevenDays
            Status: Enabled
            Prefix: batch/
            ExpirationInDays: 7
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
      Tags:
        - { Key: project, Value: translateme }

  BatchFilesBucketTlsPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BatchFilesBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt BatchFilesBucket.Arn
              - !Sub '${BatchFilesBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false

Outputs:
  TableName:
    Value: !Ref Table
    Export:
      Name: !Sub "${AWS::StackName}-TableName"
  TableArn:
    Value: !GetAtt Table.Arn
    Export:
      Name: !Sub "${AWS::StackName}-TableArn"
  KeyArn:
    Value: !GetAtt DataKey.Arn
    Export:
      Name: !Sub "${AWS::StackName}-KeyArn"
  KeyAlias:
    Value: !Ref DataKeyAlias
  BatchFilesBucketName:
    Description: S3 bucket for tenant batch uploads/results; configure as BATCH_UPLOAD_BUCKET on the Translate API Lambda.
    Value: !Ref BatchFilesBucket
  BatchFilesBucketArn:
    Description: Grant the API/worker roles object access only to this bucket and tenant prefixes.
    Value: !GetAtt BatchFilesBucket.Arn
  PayloadBucketName:
    Value: !Ref WorkerPayloadBucket
  PayloadBucketArn:
    Value: !GetAtt WorkerPayloadBucket.Arn
