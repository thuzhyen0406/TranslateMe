name: Kiểm tra hạ tầng (CloudFormation)

# Deploy thật chạy thủ công bằng `npm run demo:deploy` (docs/deploy.md). Workflow này chỉ kiểm tra template,
# không gọi AWS: trước đây nó deploy infra/template.yaml (Hello Lambda) lên account ở mọi push và PR.
on:
  push:
    branches: [main]
    paths: ['infra/**', 'e2e/demo/**', 'e2e/tests/deploy.test.ts', 'e2e/tests/infra-stacks.test.ts', '.github/workflows/deploy-infra.yml']
  pull_request:
    branches: [main]
    paths: ['infra/**', 'e2e/demo/**', 'e2e/tests/deploy.test.ts', 'e2e/tests/infra-stacks.test.ts', '.github/workflows/deploy-infra.yml']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: cfn-lint
        run: |
          pip install --quiet cfn-lint
          # W3002: TemplateURL tương đối (deploy.ts chạy cloudformation package); W3037: dynamodb:TransactWriteItems
          cfn-lint --regions ap-southeast-1 --ignore-checks W3002 W3037 -- infra/modules/*.yaml infra/stacks/*.yaml

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Kiểm tra stack và quy trình deploy (AWS CLI giả)
        working-directory: e2e
        run: |
          npm ci
          npm run typecheck
          npm run test:infra
