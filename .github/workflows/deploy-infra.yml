name: Deploy Infrastructure via CloudFormation

on:
  push:
    branches: [ main, "feat/*", "iac-cicd-pipeline" ]
  pull_request:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  cloudformation:
    name: Deploy CloudFormation Stack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::941490574112:role/GitHubActions-TranslateMe-Deployer
          aws-region: ap-southeast-1

      - name: Validate CloudFormation Template
        run: |
          aws cloudformation validate-template --template-body file://infra/template.yaml

      - name: Deploy CloudFormation Stack
        run: |
          aws cloudformation deploy \
            --template-file infra/template.yaml \
            --stack-name translateme-dev-stack \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset
